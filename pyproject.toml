[project]
name = "strand_sort"
version = "0.1.0"
description = "Community food bank donation-sorting agent — AWS Strands Agents hackathon (Good Neighbor track)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.7",
    "pillow>=10.3",
    "opencv-python-headless>=4.10",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0,<1.0.0",
    "strands-agents>=1.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strand_sort"]

[tool.setuptools.packages.find]
where = ["src"]